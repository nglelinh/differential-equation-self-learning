# Setup
title:               "Differential Equation Self-Learning"
description:         'Differential Equation Self-Learning Course by Your Name'
url:                 https://nglelinh.github.io
baseurl:             '/differential-equation-self-learning'
imgurl:              https://nglelinh.github.io/differential-equation-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Differential Equation Self-Learning"
    description: "Differential Equation Self-Learning Course by Your Name"
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Khóa học Tự học Phương trình Vi phân"
    description: "Khóa học Tự học Phương trình Vi phân bởi Your Name"
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Your Name
  email:             your.email@example.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.0.1
markdown: kramdown

# Analytics
google_analytics_id: ""
