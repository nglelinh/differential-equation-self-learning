<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Dirac operators</title>
  <desc id="desc">Diagram connecting physics, geometry, and topology through the Dirac operator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" x2="1">
      <stop offset="0%" stop-color="#114b5f"/>
      <stop offset="100%" stop-color="#1f7a8c"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" x2="1">
      <stop offset="0%" stop-color="#a31621"/>
      <stop offset="100%" stop-color="#d95d39"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" x2="1">
      <stop offset="0%" stop-color="#335c67"/>
      <stop offset="100%" stop-color="#588157"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9aa5b1" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="140" cy="100" r="64" fill="#dbeafe"/>
  <circle cx="835" cy="445" r="92" fill="#d1fae5"/>
  <circle cx="820" cy="96" r="78" fill="#fee2e2"/>

  <rect x="265" y="92" width="430" height="220" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="480" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#0f172a">Dirac Operator</text>
  <text x="480" y="188" text-anchor="middle" font-family="Courier New, monospace" font-size="28" fill="#0f172a">D = Σ c(e_j) ∇_(e_j)</text>
  <text x="480" y="230" text-anchor="middle" font-family="Courier New, monospace" font-size="24" fill="#1d4ed8">σ_D(x, ξ) = i c(ξ)</text>
  <text x="480" y="265" text-anchor="middle" font-family="Courier New, monospace" font-size="24" fill="#1d4ed8">c(ξ)^2 = -|ξ|² Id</text>
  <text x="480" y="298" text-anchor="middle" font-family="Courier New, monospace" font-size="24" fill="#7c2d12">D² = ∇*∇ + (1/4) Scal</text>

  <rect x="65" y="355" width="230" height="120" rx="24" fill="url(#cardB)" filter="url(#shadow)"/>
  <text x="180" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#ffffff">Physics</text>
  <text x="180" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff7ed">Relativistic spin-1/2</text>
  <text x="180" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff7ed">Square root of KG</text>

  <rect x="365" y="355" width="230" height="120" rx="24" fill="url(#cardA)" filter="url(#shadow)"/>
  <text x="480" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#ffffff">Geometry</text>
  <text x="480" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ecfeff">Spinors and Clifford action</text>
  <text x="480" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ecfeff">First-order ellipticity</text>

  <rect x="665" y="355" width="230" height="120" rx="24" fill="url(#cardC)" filter="url(#shadow)"/>
  <text x="780" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#ffffff">Topology</text>
  <text x="780" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#f0fdf4">Index = global invariant</text>
  <text x="780" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#f0fdf4">A-hat genus</text>

  <path d="M180 355 C220 305, 280 285, 340 270" fill="none" stroke="#d95d39" stroke-width="6" stroke-linecap="round"/>
  <path d="M480 355 C480 324, 480 304, 480 312" fill="none" stroke="#1f7a8c" stroke-width="6" stroke-linecap="round"/>
  <path d="M780 355 C740 305, 682 285, 620 270" fill="none" stroke="#588157" stroke-width="6" stroke-linecap="round"/>

  <text x="480" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">
    A bridge between PDE, quantum mechanics, spin geometry, and index theory
  </text>
</svg>
