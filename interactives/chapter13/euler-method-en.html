<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forward Euler</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 0; padding: 18px; background: #f8fafc; color: #111827; }
    h2 { margin: 0 0 12px; font-size: 1.35rem; }
    .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    label { font-size: 14px; color: #374151; }
    #plot { width: 100%; max-width: 960px; height: 520px; background: white; border: 1px solid #d1d5db; border-radius: 10px; }
    .note { color: #4b5563; max-width: 960px; font-size: 14px; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Forward Euler: Exact vs Numerical Solution</h2>
  <div class="controls">
    <label>lambda: <input id="lambda" type="range" min="-3" max="3" step="0.1" value="1.0"> <span id="lambdaVal">1.0</span></label>
    <label>step h: <input id="h" type="range" min="0.05" max="1.0" step="0.05" value="0.35"> <span id="hVal">0.35</span></label>
    <label>y(0): <input id="y0" type="range" min="0.2" max="2.5" step="0.1" value="1.0"> <span id="y0Val">1.0</span></label>
  </div>
  <div id="plot"></div>
  <div class="note">Change the step size h to see forward Euler move from a reasonable approximation to a clearly inaccurate one. This is the basic visual intuition for global error and numerical stability.</div>
  <script>
    const lambdaEl = document.getElementById('lambda');
    const hEl = document.getElementById('h');
    const y0El = document.getElementById('y0');
    const lambdaVal = document.getElementById('lambdaVal');
    const hVal = document.getElementById('hVal');
    const y0Val = document.getElementById('y0Val');
    function render() {
      const lambda = Number(lambdaEl.value), h = Number(hEl.value), y0 = Number(y0El.value);
      lambdaVal.textContent = lambda.toFixed(1); hVal.textContent = h.toFixed(2); y0Val.textContent = y0.toFixed(1);
      const tMax = 4, n = Math.floor(tMax / h);
      const t = Array.from({ length: n + 1 }, (_, i) => i * h);
      const yEuler = [y0];
      for (let i = 0; i < n; i++) yEuler.push(yEuler[i] + h * lambda * yEuler[i]);
      const tFine = Array.from({ length: 500 }, (_, i) => tMax * i / 499);
      const yExact = tFine.map(v => y0 * Math.exp(lambda * v));
      Plotly.newPlot('plot', [
        { x: tFine, y: yExact, mode: 'lines', name: 'Exact solution', line: { color: '#111827', width: 3 } },
        { x: t, y: yEuler, mode: 'lines+markers', name: 'Forward Euler', line: { color: '#2563eb', width: 3 }, marker: { size: 7 } }
      ], {
        title: "y' = lambda y: exact and forward Euler",
        xaxis: { title: 't' }, yaxis: { title: 'y(t)' }, legend: { orientation: 'h' },
        margin: { t: 60, l: 60, r: 20, b: 50 }
      }, { responsive: true });
    }
    [lambdaEl, hEl, y0El].forEach(el => el.addEventListener('input', render));
    render();
  </script>
</body>
</html>
