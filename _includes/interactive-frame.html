<div style="margin: 1.5rem 0; border: 1px solid #d8dee9; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);">
  <div style="padding: 0.85rem 1rem; background: #f8fafc; border-bottom: 1px solid #e5e7eb;">
    <div style="font-weight: 600; color: #111827;">{{ include.title }}</div>
    {% if include.description %}
    <div style="margin-top: 0.25rem; color: #4b5563; font-size: 0.95rem; line-height: 1.5;">{{ include.description }}</div>
    {% endif %}
  </div>
  <iframe
    src="{{ site.baseurl }}/{{ include.path }}"
    title="{{ include.title }}"
    loading="lazy"
    style="display: block; width: 100%; height: {{ include.height | default: '560px' }}; border: 0; background: #fff;"
  ></iframe>
  <div style="padding: 0.75rem 1rem; border-top: 1px solid #e5e7eb; background: #fcfcfd; font-size: 0.92rem; color: #4b5563;">
    <a href="{{ site.baseurl }}/{{ include.path }}" target="_blank" rel="noopener noreferrer">
      {% if page.lang == 'vi' %}
        Mở minh họa ở cửa sổ riêng
      {% else %}
        Open interactive in a separate window
      {% endif %}
    </a>
  </div>
</div>
